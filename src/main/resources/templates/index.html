<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cerevia AI — Knowledge Beyond Questions</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b0d12;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 245px;
            flex-shrink: 0;
            background: #10131b;
            border-right: 1px solid #252936;
            padding: 25px 18px;
            position: relative;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.7px;
            margin-bottom: 8px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand span,
        h1 span {
            color: #a78bfa;
        }

        .tagline {
            font-size: 12px;
            color: #8b91a3;
            margin-bottom: 32px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: 1px solid #35394a;
            background: #191d29;
            color: white;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }

        .new-chat:hover {
            background: #24293a;
        }

        .sidebar-note {
            position: absolute;
            bottom: 22px;
            left: 18px;
            font-size: 12px;
            color: #777f92;
        }

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 30px;
        }

        .status {
            border: 1px solid #292e3d;
            color: #b8c0d3;
            padding: 8px 13px;
            border-radius: 20px;
            font-size: 12px;
        }

        .welcome {
            text-align: center;
            margin: auto 0;
            width: 100%;
            max-width: 760px;
        }

        .logo {
            width: 88px;
            height: 88px;
            display: grid;
            place-items: center;
            margin: 0 auto 22px;
            background: transparent;
            border-radius: 22px;
            filter: drop-shadow(0 0 18px #8b5cf655);
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        h1 {
            font-size: clamp(28px, 4vw, 43px);
            letter-spacing: -1.3px;
            margin-bottom: 13px;
        }

        .subtitle {
            color: #959bad;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 25px;
            text-align: left;
        }

        .suggestion {
            padding: 16px;
            background: #121620;
            border: 1px solid #292e3d;
            border-radius: 13px;
            color: #e5e7eb;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.6;
            transition: border-color 0.2s, background 0.2s;
        }

        .suggestion:hover {
            border-color: #8b5cf6;
            background: #191729;
        }

        .suggestion strong {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .chat-area {
            width: 100%;
            max-width: 760px;
            margin-top: 25px;
        }

        .messages {
            max-height: 48vh;
            overflow-y: auto;
            margin-bottom: 18px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 14px 17px;
            margin: 10px 0;
            border-radius: 13px;
            line-height: 1.7;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 14px;
        }

        .user-message {
            background: #292344;
            margin-left: 35px;
        }

        .bot-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 14px 20px 14px 0;
        }

        .bot-avatar {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            object-fit: contain;
            margin-top: 5px;
            display: block;
            filter: drop-shadow(0 0 7px #8b5cf633);
        }

        .bot-message {
            flex: 1;
            min-width: 0;
            background: #151923;
            border: 1px solid #292e3d;
            margin: 0;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px;
            background: #151923;
            border: 1px solid #35394a;
            border-radius: 16px;
        }

        .input-box:focus-within {
            border-color: #8b5cf6;
        }

        #question {
            flex: 1;
            min-width: 0;
            padding: 12px;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 14px;
        }

        #question::placeholder {
            color: #777f92;
        }

        #send {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            border: none;
            border-radius: 12px;
            background: #8b5cf6;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #send:hover {
            background: #7c3aed;
        }

        #send:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .disclaimer {
            text-align: center;
            color: #73798b;
            font-size: 11px;
            margin-top: 12px;
        }

        @media (max-width: 650px) {
            .sidebar {
                display: none;
            }

            .main {
                padding: 18px 14px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome {
                margin-top: 35px;
            }

            .logo {
                width: 68px;
                height: 68px;
            }

            .bot-row {
                margin-right: 0;
                gap: 8px;
            }

            .bot-avatar {
                width: 26px;
                height: 26px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <div class="brand">
            <img
                src="/images/cerevia-logo.png"
                alt="Cerevia logo"
                class="brand-logo"
            >
            <div>Cerevia <span>AI</span></div>
        </div>

        <div class="tagline">Knowledge Beyond Questions.</div>

        <button class="new-chat" id="newChat" type="button">
            ＋ &nbsp; New conversation
        </button>

        <div class="sidebar-note">
            Your ideas. Your questions. One place.
        </div>
    </aside>

    <main class="main">
        <header>
            <div class="status">✦ &nbsp; AI Assistant</div>
        </header>

        <section class="welcome" id="welcome">
            <div class="logo">
                <img
                    src="/images/cerevia-logo.png"
                    alt="Cerevia AI logo"
                >
            </div>

            <h1>Think beyond with <span>Cerevia.</span></h1>

            <p class="subtitle">
                Your intelligent space to learn, explore and create.<br>
                What would you like to discover today?
            </p>

            <div class="suggestions">
                <button
                    class="suggestion"
                    data-question="Explain Java OOP concepts with simple examples."
                >
                    <strong>📚 Learn something</strong>
                    Explain Java OOP concepts with examples
                </button>

                <button
                    class="suggestion"
                    data-question="Help me create a study plan for my exams."
                >
                    <strong>🎯 Plan your goals</strong>
                    Build a study plan for my exams
                </button>

                <button
                    class="suggestion"
                    data-question="Give me an interesting beginner-friendly Java project idea."
                >
                    <strong>💡 Explore ideas</strong>
                    Find an interesting Java project
                </button>

                <button
                    class="suggestion"
                    data-question="Explain how artificial intelligence works in simple language."
                >
                    <strong>🧠 Understand AI</strong>
                    How does artificial intelligence work?
                </button>
            </div>
        </section>

        <section class="chat-area">
            <div class="messages" id="messages" aria-live="polite"></div>

            <form class="input-box" id="chatForm">
                <input
                    id="question"
                    type="text"
                    placeholder="Ask Cerevia anything..."
                    autocomplete="off"
                    aria-label="Your question"
                    required
                >

                <button id="send" type="submit" aria-label="Send message">
                    ↑
                </button>
            </form>

            <p class="disclaimer">
                Cerevia AI can make mistakes. Verify important information.
            </p>
        </section>
    </main>

    <script>
        const form = document.getElementById("chatForm");
        const input = document.getElementById("question");
        const messages = document.getElementById("messages");
        const welcome = document.getElementById("welcome");
        const sendButton = document.getElementById("send");
        const newChatButton = document.getElementById("newChat");

        let isSending = false;

        function addMessage(text, type) {
            let message;

            if (type === "bot-message") {
                message = document.createElement("div");
                message.className = "bot-row";

                const avatar = document.createElement("img");
                avatar.className = "bot-avatar";
                avatar.src = "/images/cerevia-logo.png";
                avatar.alt = "Cerevia AI";

                avatar.onerror = function () {
                    this.style.display = "none";
                };

                const bubble = document.createElement("div");
                bubble.className = "message bot-message";
                bubble.textContent = text;

                message.appendChild(avatar);
                message.appendChild(bubble);
            } else {
                message = document.createElement("div");
                message.className = "message " + type;
                message.textContent = text;
            }

            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;

            return message;
        }

        async function submitQuestion(question) {
            const text = question.trim();

            if (!text || isSending) {
                return;
            }

            isSending = true;
            sendButton.disabled = true;
            input.disabled = true;

            welcome.style.display = "none";

            addMessage(text, "user-message");
            input.value = "";

            const loadingMessage = addMessage(
                "Cerevia is thinking...",
                "bot-message"
            );

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: text
                    })
                });

                let data;

                try {
                    data = await response.json();
                } catch {
                    data = {};
                }

                loadingMessage.remove();

                if (!response.ok) {
                    addMessage(
                        data.reply ||
                        "The AI service returned an error. Please try again.",
                        "bot-message"
                    );
                    return;
                }

                addMessage(
                    data.reply ||
                    "The AI returned an empty response. Please try again.",
                    "bot-message"
                );

            } catch (error) {
                loadingMessage.remove();

                addMessage(
                    "Could not connect to the Cerevia server. Please try again.",
                    "bot-message"
                );

                console.error("Chat request failed:", error);

            } finally {
                isSending = false;
                sendButton.disabled = false;
                input.disabled = false;
                input.focus();
            }
        }

        form.addEventListener("submit", function (event) {
            event.preventDefault();
            submitQuestion(input.value);
        });

        document.querySelectorAll(".suggestion").forEach(function (button) {
            button.addEventListener("click", function () {
                submitQuestion(button.dataset.question);
            });
        });

        newChatButton.addEventListener("click", function () {
            if (isSending) {
                return;
            }

            messages.replaceChildren();
            input.value = "";
            welcome.style.display = "block";
            input.focus();
        });
    </script>
</body>
</html>
